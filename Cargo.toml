[package]
name = "keyboard-center"
version = "0.1.0"
edition = "2021"
description = "Keyboard-Center — управление механическими клавиатурами AULA и Ajazz"
license = "MIT"
authors = ["Dark_Siders <emails@test.ru>"]

[lib]
name = "keyboard_center"
path = "src/lib.rs"

[[bin]]
name = "keyboard-center"
path = "src/main.rs"

[[bin]]
name = "kbc"
path = "src/cli.rs"

[dependencies]
# GUI
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
glib = "0.20"
gio = "0.20"

# HID-взаимодействие с клавиатурами
hidapi = "2.5"

# Обработка изображений для TFT-экрана Ajazz
image = { version = "0.25", features = ["gif", "jpeg", "png"] }

# Сериализация профилей (TOML)
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Синхронизация часов TFT Ajazz: локальное время ПК (naive_local).
# Добавлен без unstable — обычный crates.io пакет (журнал 10.63).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Ошибки
anyhow = "1"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Async для сканера устройств
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }

# Работа с файловой системой (glob для /dev/hidraw)
glob = "0.3"

[profile.release]
lto = true
opt-level = 3