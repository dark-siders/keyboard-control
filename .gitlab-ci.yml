# --- CI для Keyboard-Center (GitLab) ---
# Сборка/тесты Rust-пакета, который собирается Nix Flake + crane.
# Локальный прогон: nix develop . --command cargo test --lib / cargo clippy --all-targets

stages:
  - check
  - build

variables:
  NIX_CONFIG: "experimental-features = nix-command flakes"

# --- Тесты (быстрые, на каждый MR/ветку) -------------------------------
test:
  stage: check
  image: nixos/nix:latest
  before_script:
    - nix --version
  script:
    - nix develop . --command cargo test --lib
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
  cache:
    key: nix-store
    paths:
      - /nix/store
    policy: pull-push

# --- Lint (clippy, без -D warnings) -------------------------------------
clippy:
  stage: check
  image: nixos/nix:latest
  before_script:
    - nix --version
  script:
    - nix develop . --command cargo clippy --all-targets
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
  cache:
    key: nix-store
    paths:
      - /nix/store
    policy: pull-push

# --- Сборка пакета (оба бинарника: keyboard-center + kbc) --------------
build:
  stage: build
  image: nixos/nix:latest
  before_script:
    - nix --version
  script:
    - nix build .#keyboard-center
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
  cache:
    key: nix-store
    paths:
      - /nix/store
    policy: pull-push

# --- Fedora: проверка, что пакет собирается без nix (dnf + cargo) ------
# Свежий Fedora-контейнер: ставим системные dev-пакеты (как это делает
# fedora.sh deps), затем обычный cargo build/test.
fedora-build:
  stage: build
  image: fedora:latest
  before_script:
    - dnf install -y rust cargo gcc pkgconf make gtk4-devel libadwaita-devel glib2-devel gdk-pixbuf2-devel cairo-devel pango-devel hidapi-devel libudev-devel pulseaudio-libs-devel
  script:
    - cargo build --release --all-targets
    - cargo test --lib
    # Синтаксис установочных/диагностических скриптов (быстро, ловит опечатки)
    - bash -n fedora.sh
    - bash -n scripts/collect-data.sh scripts/ajazz-usb-diag.sh scripts/ajazz-usb-rev.sh scripts/f75-usb-rev.sh scripts/f99-usb-rev.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH